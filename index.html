<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>products</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="cards-catalog">
      <h1 class="cards-catalog__title">Выбери свой продукт</h1>
      <div class="cards-catalog__list">
        <button id="registration">Регистрация</button>
        <div class="buttons-panel">
          <button id="change-color-all-card">Сменить цвет всех карточек</button>
          <button id="change-color-first-card">Сменить цвет первой карточки</button>
          <button id="open-google">Открыть страницу Google.com</button>
          <button id="output-console-log">Вывести сообщение в консоль лог</button>
          <button class="change-color-button">Сменить цвет кнопки и обратно</button>
        </div>
        <ul id="product-list"></ul>
        <template id="product-template">
          <article class="product-card">
            <img class="product-card__image" src="" alt="" width="290" height="245" />
            <div class="product-card__purpose"></div>
            <h3 class="product-card__title"></h3>
            <p class="product-card__description"></p>
            <p class="product-card__compound">Состав:</p>
            <ul class="product-card__ingredients"></ul>
            <div class="product-card__price">
              <b>Цена:</b>
              <span></span>
            </div>
          </article>
        </template>
      </div>
      <div class="modal">
        <div class="overlay"></div>
        <div class="modal__content">
          <button class="modal__close-button">&times;</button>
          <h2 class="modal__title">Регистрация</h2>
          <form class="modal__form">
            <label for="firstname">Имя пользователя:</label>
            <input type="text" id="firstname" name="firstname" placeholder="Введите имя..." required />

            <label for="lastname">Фамилия пользователя:</label>
            <input type="text" id="lastname" name="lastname" placeholder="Введите фамилию..." required />

            <label for="date">Дата рождения:</label>
            <input type="date" id="date" name="date" placeholder="Введите дату рождения..." required />

            <label for="login">Login:</label>
            <input type="text" id="login" name="login" placeholder="Введите Login..." required />

            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Введите Password..." required />

            <label for="repeat-password">Подтвердите пароль:</label>
            <input
              type="password"
              id="repeat-password"
              name="repeat-password"
              placeholder="Повторите Password..."
              required
            />
            <button type="submit">Зарегистрироваться</button>
          </form>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="footer__container">
        <div class="footer__top">
          <h3 class="footer__title">Product Cards</h3>
          <p class="footer__description">У нас самые лучшие продукты для кожи!</p>
          <div class="footer__social-links">
            <a href="https://telegram.com" target="_blank" rel="noopener noreferrer">
              <img src="images/telegram.png" alt="Telegram" width="21" height="17.61" />
            </a>
            <a href="https://vk.com" target="_blank" rel="noopener noreferrer">
              <img src="images/vk.png" alt="ВКонтакте" width="24" height="14" />
            </a>
          </div>
        </div>
        <div class="footer__form">
          <form class="footer__email-form">
            <h3 class="footer__form-title">Подпишись на наши акции:</h3>
            <div class="footer__form-input">
              <input type="email" id="email" name="email" placeholder="Введите Email..." required />
              <button class="footer__form-button" type="submit">Подписаться</button>
            </div>
          </form>
        </div>
        <div>
          <nav class="footer__fast-links">
            <h3 class="footer__fast-links-title">Быстрые ссылки</h3>
            <ul class="footer__fast-links-list">
              <li><a href="#" class="footer__fast-link">Главная</a></li>
              <li><a href="#" class="footer__fast-link">Магазин</a></li>
              <li><a href="#" class="footer__fast-link">Контакты</a></li>
            </ul>
          </nav>
        </div>
      </div>
      <div class="footer__bottom">
        <div class="footer__copyright">
          <hr class="footer__divider" />
          <p class="footer__copyright-text">www.product-cards.com©all right reserved.</p>
        </div>
      </div>
    </footer>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
    <script src="main.js" type="module"></script>
    <script src="homework-11.js" type="module"></script>
  </body>
</html>
